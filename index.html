    <!-- Fonts: preconnect + non-blocking stylesheet (frees render path; only ship used weights).
         Kept above analytics so the font connections claim their sockets first — GA is
         async and non-critical, but it competes for connection slots during the exact
         window the LCP image and webfonts need them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link
        rel="stylesheet"

      >
    </noscript>

    <!--
      Critical preloader CSS, inlined.

      Must not wait on the bundled stylesheet: that is a separate request, and
      any gap between first paint and its arrival would flash unstyled markup.
      Roughly 1.3 KB, so it costs less than the round trip it avoids.

      Timeline (all composited, main thread untouched):
        0ms     ground paints
        60ms    mark scales + fades in        (520ms)
        300ms   wordmark rises                (420ms)
        460ms   rule wipes left to right      (860ms)
        1500ms  overlay fades out             (420ms)
        1920ms  visibility:hidden — self-clears even with no JS
    -->
    <style>
      .tnr-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(100 10% 96%);
        animation: tnr-pre-out 420ms cubic-bezier(0.16, 1, 0.3, 1) 1500ms both;
      }
      @media (prefers-color-scheme: dark) {
        .tnr-preloader { background: hsl(140 25% 10%); }
      }
      .tnr-preloader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .tnr-preloader__mark {
        width: 108px;
        height: 108px;
        transform: scale(0.94);
        opacity: 0;
        animation: tnr-pre-mark 520ms cubic-bezier(0.16, 1, 0.3, 1) 60ms forwards;
      }
      .tnr-preloader__word {
        margin: 18px 0 0;
        font-family: "Playfair Display", Georgia, serif;
        font-size: 1.25rem;
        letter-spacing: 0.06em;
        color: hsl(146 28% 29%);
        opacity: 0;
        transform: translateY(8px);
        animation: tnr-pre-word 420ms cubic-bezier(0.16, 1, 0.3, 1) 300ms forwards;
      }
      @media (prefers-color-scheme: dark) {
        .tnr-preloader__word { color: hsl(145 35% 48%); }
      }
      .tnr-preloader__rule {
        margin-top: 16px;
        width: 132px;
        height: 2px;
        overflow: hidden;
        background: hsl(146 28% 29% / 0.14);
      }
      .tnr-preloader__rule span {
        display: block;
        width: 100%;
        height: 100%;
        background: hsl(120 61% 27%);
        transform: scaleX(0);
        transform-origin: left center;
        animation: tnr-pre-rule 860ms cubic-bezier(0.16, 1, 0.3, 1) 460ms forwards;
      }
      @media (prefers-color-scheme: dark) {
        .tnr-preloader__rule span { background: hsl(145 35% 48%); }
      }
      @keyframes tnr-pre-mark {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes tnr-pre-word {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes tnr-pre-rule {
        to { transform: scaleX(1); }
      }
      @keyframes tnr-pre-out {
        to { opacity: 0; visibility: hidden; }
      }

      /* Reduced motion: no sequence at all. The overlay is never shown, so
         content is revealed immediately rather than animating faster. This is
         a structural fallback, not a shortened animation. */
      @media (prefers-reduced-motion: reduce) {
        .tnr-preloader { display: none; }
      }

      /* Set by main.tsx once React has mounted, and by the sessionStorage
         check below on repeat navigation within a session. */
      .tnr-preloader--done {
        opacity: 0;
        visibility: hidden;
        transition: opacity 320ms cubic-bezier(0.16, 1, 0.3, 1), visibility 0s 320ms;
      }
      .tnr-preloader--skip {
        display: none;
      }
    </style>
    <script>
      // Show the full intro on the first load of a session only; repeat
      // navigation within the session skips straight to content. Runs before
      // paint so there is no flash of a splash the user has already seen.
      try {
        if (sessionStorage.getItem("tnr:intro-seen")) {
          document.documentElement.classList.add("tnr-intro-seen");
        } else {
          sessionStorage.setItem("tnr:intro-seen", "1");
        }
      } catch (e) {
        /* private mode — just show the intro */
      }
    </script>
    <style>
      .tnr-intro-seen .tnr-preloader { display: none; }
    </style>

    <!-- Google tag (gtag.js) — loaded once sitewide, after the font preconnects.
         SPA route page_views are emitted from src/lib/analytics.ts via useGaPageviews(). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RBBGBDDXQL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // ── DPDP s.6: consent before processing ──────────────────────────────
      // Consent Mode defaults are set BEFORE the tag initialises, so no
      // analytics or advertising storage is written until the visitor makes an
      // affirmative choice. This is the "denied by default" posture the Act
      // requires; src/lib/consent.ts issues a `consent update` once a decision
      // is recorded, and re-applies the stored decision on every later load.
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });

      // Re-apply a previously stored decision immediately, so a returning
      // visitor who already accepted is measured from the first pageview
      // rather than waiting for React to hydrate.
      try {
        var stored = JSON.parse(localStorage.getItem('tnr:consent') || 'null');
        if (stored && stored.version === 1 && stored.state) {
          gtag('consent', 'update', {
            analytics_storage: stored.state.analytics ? 'granted' : 'denied',
            ad_storage: stored.state.marketing ? 'granted' : 'denied',
            ad_user_data: stored.state.marketing ? 'granted' : 'denied',
            ad_personalization: stored.state.marketing ? 'granted' : 'denied'
          });
        }
      } catch (e) { /* no stored consent — defaults stand */ }

      gtag('js', new Date());
      // send_page_view: false — we send page_view manually on every SPA route
      // change so client-side navigation is tracked accurately without
      // double-firing on initial load.
      gtag('config', 'G-RBBGBDDXQL', { send_page_view: false });
    </script>

    <!--
      Brand preloader.

      Lives in the HTML shell rather than in React so it paints on the very
      first frame, before the bundle has parsed — which is the whole point of a
      preloader. The previous React implementation could not do this: it only
      appeared once the JS had downloaded, parsed and mounted, by which time
      the app was already usable, so on a fast connection it flashed or never
      appeared at all.

      Every animation here is `transform` or `opacity` only, expressed as CSS
      keyframes. No JavaScript drives it, so it contributes **zero** to Total
      Blocking Time — the compositor runs the whole sequence off the main
      thread while React boots in parallel.

      It is also self-dismissing: the final keyframe sets visibility:hidden, so
      if the bundle fails to load entirely the overlay still clears rather than
      trapping the user behind a permanent splash.
    -->
    <div id="tnr-preloader" class="tnr-preloader" role="status" aria-label="Loading The Nilgiri Root">
      <div class="tnr-preloader__inner">
        <svg class="tnr-preloader__mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="tnrLoadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="hsl(146 28% 29%)" />
              <stop offset="100%" stop-color="hsl(120 61% 27%)" />
            </linearGradient>
          </defs>
          <path
            fill="url(#tnrLoadGrad)"
            d="M50 30 C55 30, 58 35, 58 60 L58 170 C58 175, 55 178, 50 178 L42 178 C37 178, 34 175, 34 170 L34 60 C34 35, 37 30, 42 30Z M80 25 C85 25, 88 30, 88 55 L88 175 C88 180, 85 183, 80 183 L72 183 C67 183, 64 180, 64 175 L64 55 C64 30, 67 25, 72 25Z M110 28 C115 28, 118 33, 118 58 L118 172 C118 177, 115 180, 110 180 L102 180 C97 180, 94 177, 94 172 L94 58 C94 33, 97 28, 102 28Z M140 32 C145 32, 148 37, 148 62 L148 168 C148 173, 145 176, 140 176 L132 176 C127 176, 124 173, 124 168 L124 62 C124 37, 127 32, 132 32Z M168 27 C173 27, 176 32, 176 57 L176 174 C176 179, 173 182, 168 182 L160 182 C155 182, 152 179, 152 174 L152 57 C152 32, 155 27, 160 27Z"
          />
        </svg>
        <p class="tnr-preloader__word">The Nilgiri Root</p>
        <div class="tnr-preloader__rule"><span></span></div>
      </div>
    </div>
